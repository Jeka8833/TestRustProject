name: Build Cross-Platform Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 1. Сборка Java (JNI) и C# (NuGet) под Windows, Linux и macOS
  build-java-csharp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          # При необходимости добавьте Intel macOS:
          # - os: macos-15-intel
          #   name: macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo & BoltFFI CLI
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "java-csharp-${{ matrix.name }}"
          cache-directories: ~/.cargo/bin

      - name: Setup JDK (for boltffi pack java)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup .NET SDK (for boltffi pack csharp)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x" # должен соответствовать target_framework в boltffi.toml

      - name: Install Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Ensure Clang is in PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $candidates = @(
              "C:\Program Files\LLVM\bin",
              "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin"
            )
            foreach ($dir in $candidates) {
              if (Test-Path "$dir\clang.exe") {
                "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                break
              }
            }
          }

      - name: Install BoltFFI CLI
        shell: bash
        run: |
          if ! command -v boltffi &> /dev/null; then
            cargo install boltffi_cli --locked
          fi

      - name: Check environment
        run: boltffi check

      - name: Pack Java
        run: boltffi pack java --release

      - name: Pack C#
        run: boltffi pack csharp --release

      - name: Upload Java artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-dist-${{ matrix.name }}
          path: dist/java/

      - name: Upload C# artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csharp-dist-${{ matrix.name }}
          path: dist/csharp/

  # 2. Сборка Python wheels под Windows, Linux, macOS и несколько версий Python
  build-python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo & BoltFFI CLI
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "python-${{ matrix.name }}"
          cache-directories: ~/.cargo/bin

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install BoltFFI CLI
        shell: bash
        run: |
          if ! command -v boltffi &> /dev/null; then
            cargo install boltffi_cli --locked
          fi

      - name: Pack Python
        run: boltffi pack python --release

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.name }}-py${{ matrix.python-version }}
          path: dist/python/wheelhouse/*.whl

  # 3. Объединение всех артефактов в один архив
  bundle-release:
    needs: [build-java-csharp, build-python]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge artifacts
        run: |
          mkdir -p combined/java/native
          mkdir -p combined/csharp/runtimes
          mkdir -p combined/csharp/packages
          mkdir -p combined/python

          # --- Java: общие .java исходники + нативные библиотеки всех ОС ---
          first_java=$(find artifacts -maxdepth 1 -type d -name "java-dist-*" | head -n 1)
          cp -r "$first_java"/* combined/java/ 2>/dev/null || true
          rm -rf combined/java/native/*
          for dir in artifacts/java-dist-*; do
            if [ -d "$dir/native" ]; then
              cp -r "$dir/native/"* combined/java/native/
            fi
          done

          # --- C#: исходники, .csproj, нативные runtimes/* всех ОС и .nupkg ---
          first_cs=$(find artifacts -maxdepth 1 -type d -name "csharp-dist-*" | head -n 1)
          cp "$first_cs/BoltFFI.CSharp.csproj" combined/csharp/
          cp -r "$first_cs/src" combined/csharp/
          for dir in artifacts/csharp-dist-*; do
            if [ -d "$dir/runtimes" ]; then
              cp -r "$dir/runtimes/"* combined/csharp/runtimes/
            fi
            if [ -d "$dir/packages" ]; then
              cp "$dir/packages/"*.nupkg combined/csharp/packages/
            fi
          done

          # --- Python: все .whl для всех ОС и версий Python ---
          cp artifacts/python-wheel-*/*.whl combined/python/

      - name: Upload combined release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: combined/

      - name: Setup JDK for building JAR
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build universal fat JAR
        run: |
          mkdir -p jar-build
          find combined/java/com -name "*.java" > sources.txt
          javac --release 17 -d jar-build @sources.txt
          cp -r combined/java/native jar-build/
          jar --create --file combined/java/blendshaperouter.jar -C jar-build .