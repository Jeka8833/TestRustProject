name: Build & Publish BoltFFI Packages

on:
  workflow_dispatch:
    inputs:
      use_test_pypi:
        description: 'Publish Python packages to TestPyPI (test.pypi.org) instead of PyPI'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  JAVA_GROUP_ID: "com.${{ github.repository_owner }}"
  JAVA_ARTIFACT_ID: "${{ github.event.repository.name }}"

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Read version from Cargo.toml
        id: resolve
        shell: bash
        run: |
          python3 - <<'EOF'
          import os, pathlib, sys, tomllib

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          pkg_ver = cargo.get("package", {}).get("version")
          ws_ver = cargo.get("workspace", {}).get("package", {}).get("version")
          version = pkg_ver if isinstance(pkg_ver, str) else ws_ver

          if not isinstance(version, str) or not version.strip():
              print("::error::Failed to find the version field in Cargo.toml", file=sys.stderr)
              sys.exit(1)

          version = version.strip()
          print(f"Resolved version from Cargo.toml: {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
          EOF

  test:
    name: Run Rust Tests
    needs: [ resolve-version ]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-test

      - name: Run cargo test
        run: cargo test --locked

  build-java:
    name: Build Java Native (${{ matrix.java_target }})
    needs: [ resolve-version, test ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - java_target: darwin-arm64
            os: macos-15
          - java_target: darwin-x86_64
            os: macos-15-intel
          - java_target: linux-x86_64
            os: ubuntu-24.04
          - java_target: linux-aarch64
            os: ubuntu-24.04-arm
          - java_target: windows-x86_64
            os: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-java-${{ matrix.java_target }}

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '8'

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          else
            echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          fi

      - name: Setup boltffi_cli
        uses: ./.github/actions/setup-boltffi

      - name: Pack Java JNI for ${{ matrix.java_target }}
        shell: bash
        run: |
          cat <<'EOF' > boltffi.ci-java.toml
          [targets.java]
          min_version = 8

          [targets.java.jvm]
          enabled = true
          host_targets = ["current"]
          EOF
          boltffi --overlay boltffi.ci-java.toml pack java --release

      - name: Upload native library (${{ matrix.java_target }})
        uses: actions/upload-artifact@v7
        with:
          name: java-native-${{ matrix.java_target }}
          path: dist/java/native/${{ matrix.java_target }}/*
          retention-days: 1
          if-no-files-found: error

      - name: Archive generated Java 8 sources
        if: matrix.java_target == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          cd dist/java
          find . -name '*.java' -print0 | tar --null -T - -cf ../../java-sources.tar

      - name: Upload generated Java 8 sources
        if: matrix.java_target == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: java-sources
          path: java-sources.tar
          retention-days: 1
          if-no-files-found: error

      - name: Cancel workflow on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  build-csharp:
    name: Build C# Native (${{ matrix.rid }})
    needs: [ resolve-version, test ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: osx-arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - rid: osx-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - rid: linux-x64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - rid: win-x64
            os: windows-2025
            rust_target: x86_64-pc-windows-msvc
          - rid: win-arm64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-csharp-${{ matrix.rid }}

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          else
            echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          fi

      - name: Build Rust cdylib for ${{ matrix.rust_target }}
        run: cargo build --release --locked --target ${{ matrix.rust_target }}

      - name: Upload native cdylib (${{ matrix.rid }})
        uses: actions/upload-artifact@v7
        with:
          name: csharp-cdylib-${{ matrix.rust_target }}
          path: |
            target/${{ matrix.rust_target }}/release/*.so
            target/${{ matrix.rust_target }}/release/*.dylib
            target/${{ matrix.rust_target }}/release/*.dll
          retention-days: 1
          if-no-files-found: error

      - name: Cancel workflow on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  build-python:
    name: Build Python Wheels (${{ matrix.os }})
    needs: [ resolve-version, test ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15, macos-15-intel ]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-python-${{ matrix.os }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip setuptools wheel tomli-w

      - name: Setup boltffi_cli
        uses: ./.github/actions/setup-boltffi

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          else
            echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          fi

      - name: Generate Python package with BoltFFI
        shell: bash
        run: |
          cat <<'EOF' > boltffi.ci-python.toml
          [targets.python]
          enabled = true

          [targets.python.wheel]
          output = "dist/python/wheelhouse"
          EOF
          boltffi --overlay boltffi.ci-python.toml pack python --release --python python
          rm -rf dist/python/wheelhouse dist/python/build dist/python/*.egg-info
          find dist/python -maxdepth 2 \( -name '_native*.so' -o -name '_native*.pyd' \) -delete

      - name: Populate pyproject.toml metadata and README from Cargo.toml
        shell: bash
        run: |
          python - <<'EOF'
          import ast, os, pathlib, re, shutil, tomllib, tomli_w

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          pkg = cargo.get("package", {})
          ws_pkg = cargo.get("workspace", {}).get("package", {})

          def get_meta(key, default=None):
              val = pkg.get(key)
              if isinstance(val, dict) and val.get("workspace") is True:
                  val = ws_pkg.get(key, default)
              return default if val is None else val

          version = str(get_meta("version", "")).strip()
          summary = " ".join(str(get_meta("description", "")).split())
          license_str = str(get_meta("license", "")).strip()
          authors_val = get_meta("authors", [])
          homepage = str(get_meta("homepage", "")).strip()
          repository = str(get_meta("repository", "")).strip() or f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"

          pypi_meta = pkg.get("metadata", {}).get("pypi") or cargo.get("workspace", {}).get("metadata", {}).get("pypi", {})
          classifiers = [str(c).strip() for c in pypi_meta.get("classifiers", []) if str(c).strip()]
          custom_urls = {
              str(k).strip(): str(v).strip()
              for k, v in pypi_meta.get("urls", {}).items()
              if str(k).strip() and str(v).strip()
          }

          lower_labels = {k.lower() for k in custom_urls}
          if homepage and "homepage" not in lower_labels:
              custom_urls.setdefault("Homepage", homepage)
          if repository and "repository" not in lower_labels and "source" not in lower_labels:
              custom_urls.setdefault("Repository", repository)
          if repository.startswith("https://github.com/") and "issues" not in lower_labels and "bug tracker" not in lower_labels:
              custom_urls.setdefault("Issues", f"{repository.rstrip('/')}/issues")

          _NON_LITERAL = object()
          setup_py_path = pathlib.Path("dist/python/setup.py")
          setup_py_text = setup_py_path.read_text(encoding="utf-8") if setup_py_path.is_file() else ""
          setup_kwargs = {}
          if setup_py_text:
              tree = ast.parse(setup_py_text)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and (
                      (isinstance(node.func, ast.Name) and node.func.id == "setup")
                      or (isinstance(node.func, ast.Attribute) and node.func.attr == "setup")
                  ):
                      for kw in node.keywords:
                          if kw.arg:
                              try:
                                  setup_kwargs[kw.arg] = ast.literal_eval(kw.value)
                              except Exception:
                                  setup_kwargs[kw.arg] = _NON_LITERAL

          pyproject_path = pathlib.Path("dist/python/pyproject.toml")
          pyproject = tomllib.loads(pyproject_path.read_text(encoding="utf-8"))
          project = pyproject.setdefault("project", {})
          dynamic = set(project.get("dynamic", []))

          if "name" not in project and "name" not in dynamic:
              setup_name = setup_kwargs.get("name")
              if isinstance(setup_name, str) and setup_name.strip():
                  project["name"] = setup_name.strip()
              else:
                  pkg_name = str(get_meta("name", "")).strip()
                  if pkg_name:
                      project["name"] = pkg_name

          if version:
              project["version"] = version
              dynamic.discard("version")

          if "requires-python" not in project:
              py_req = setup_kwargs.get("python_requires")
              if isinstance(py_req, str) and py_req.strip():
                  project["requires-python"] = py_req.strip()
                  dynamic.discard("requires-python")
              elif py_req is not None or "python_requires" in setup_py_text:
                  dynamic.add("requires-python")

          if summary:
              project["description"] = summary
              dynamic.discard("description")

          if license_str:
              project["license"] = {"text": license_str}
              dynamic.discard("license")

          if isinstance(authors_val, list):
              parsed_authors = []
              for raw in authors_val:
                  raw = str(raw).strip()
                  if not raw:
                      continue
                  m = re.match(r"^(.*?)\s*<([^>]+)>$", raw)
                  if m:
                      entry = {}
                      if m.group(1).strip():
                          entry["name"] = m.group(1).strip()
                      if m.group(2).strip():
                          entry["email"] = m.group(2).strip()
                      if entry:
                          parsed_authors.append(entry)
                  else:
                      parsed_authors.append({"name": raw})
              if parsed_authors:
                  project["authors"] = parsed_authors
                  dynamic.discard("authors")

          if classifiers:
              project["classifiers"] = classifiers
              dynamic.discard("classifiers")

          if custom_urls:
              urls = project.setdefault("urls", {})
              urls.update(custom_urls)
              dynamic.discard("urls")

          readme_cfg = get_meta("readme", "README.md")
          readme_src = pathlib.Path(readme_cfg if isinstance(readme_cfg, str) else "README.md")
          if readme_src.is_file():
              shutil.copyfile(readme_src, pathlib.Path("dist/python/README.md"))
              project["readme"] = {"file": "README.md", "content-type": "text/markdown"}
              dynamic.discard("readme")

          setup_to_pep621 = {
              "description": "description",
              "long_description": "readme",
              "license": "license",
              "author": "authors",
              "author_email": "authors",
              "maintainer": "maintainers",
              "maintainer_email": "maintainers",
              "keywords": "keywords",
              "classifiers": "classifiers",
              "url": "urls",
              "project_urls": "urls",
              "install_requires": "dependencies",
              "extras_require": "optional-dependencies",
          }
          for setup_key, pep_key in setup_to_pep621.items():
              if pep_key not in project and setup_key in setup_kwargs and setup_kwargs[setup_key]:
                  dynamic.add(pep_key)

          if "entry_points" in setup_kwargs and setup_kwargs["entry_points"]:
              ep = setup_kwargs["entry_points"]
              if isinstance(ep, dict):
                  if "scripts" not in project and ep.get("console_scripts"):
                      dynamic.add("scripts")
                  if "gui-scripts" not in project and ep.get("gui_scripts"):
                      dynamic.add("gui-scripts")
                  if "entry-points" not in project and any(k not in ("console_scripts", "gui_scripts") for k in ep):
                      dynamic.add("entry-points")
              else:
                  for k in ("scripts", "gui-scripts", "entry-points"):
                      if k not in project:
                          dynamic.add(k)

          if dynamic:
              project["dynamic"] = sorted(dynamic)
          elif "dynamic" in project:
              del project["dynamic"]

          pyproject_path.write_text(tomli_w.dumps(pyproject), encoding="utf-8")
          EOF

      - name: Build Python wheels with cibuildwheel
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: dist/python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux* *-manylinux_i686 *-win32"
          CIBW_TEST_COMMAND: python -c "import importlib, pathlib; pkgs = [p.name for p in pathlib.Path(r'{package}').iterdir() if p.is_dir() and (p / '__init__.py').is_file()]; assert pkgs; [importlib.import_module(m) for m in pkgs]"
          CIBW_BEFORE_ALL_LINUX: >-
            set -eu &&
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal &&
            . "$HOME/.cargo/env" &&
            cargo build --release --locked --manifest-path "{project}/Cargo.toml" --target-dir /tmp/cibw-target &&
            find "{package}" -maxdepth 2 -name '*.so' -type f -exec sh -c 'for f do cp "/tmp/cibw-target/release/$(basename "$f")" "$f"; done' sh {} +

      - name: Upload Python wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 1
          if-no-files-found: error

      - name: Cancel workflow on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  publish:
    name: Publish Packages
    needs: [ resolve-version, build-java, build-csharp, build-python ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: publish
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download all Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-*
          merge-multiple: true
          path: wheelhouse

      - name: Publish Python wheels to PyPI (OIDC)
        if: ${{ !inputs.use_test_pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/

      - name: Publish Python wheels to TestPyPI (OIDC)
        if: ${{ inputs.use_test_pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
          repository-url: https://test.pypi.org/legacy/

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup boltffi_cli
        uses: ./.github/actions/setup-boltffi

      - name: Download all 6 native cdylib artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: csharp-cdylib-*
          path: csharp-staging

      - name: Place prebuilt libraries in target/<triple>/release/
        run: |
          set -euo pipefail
          for dir in csharp-staging/csharp-cdylib-*; do
            triple="${dir#csharp-staging/csharp-cdylib-}"
            mkdir -p "target/${triple}/release"
            cp "$dir"/* "target/${triple}/release/"
          done

      - name: Generate C# bindings and multi-RID NuGet package (.NET 10)
        run: |
          set -euo pipefail
          cat <<'EOF' > boltffi.ci-csharp.toml
          [targets.csharp]
          enabled = true
          output = "dist/csharp"
          target_framework = "net10.0"
          runtime_identifiers = ["osx-arm64", "osx-x64", "linux-x64", "linux-arm64", "win-x64", "win-arm64"]
          EOF
          boltffi --overlay boltffi.ci-csharp.toml pack csharp --release --no-build

          CSPROJ="$(find dist/csharp -maxdepth 1 -name '*.csproj' | head -n 1)"
          if [ -z "$CSPROJ" ]; then
            echo "::error::No .csproj file found in dist/csharp"
            exit 1
          fi

          rm -f dist/csharp/packages/*.nupkg
          dotnet pack "$CSPROJ" \
            -c Release \
            -p:PackageVersion="${{ needs.resolve-version.outputs.version }}" \
            -p:RepositoryUrl="https://github.com/${{ github.repository }}" \
            -o dist/csharp/packages

      - name: Push NuGet package to GitHub Packages
        run: |
          OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          dotnet nuget push "dist/csharp/packages/*.nupkg" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/${OWNER_LOWER}/index.json" \
            --skip-duplicate

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '8'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Download Java sources archive
        uses: actions/download-artifact@v8
        with:
          name: java-sources
          path: java-sources-staging

      - name: Extract Java sources into Maven layout
        run: |
          set -euo pipefail
          mkdir -p java-pkg/src/main/java
          tar -xf java-sources-staging/java-sources.tar -C java-pkg/src/main/java

      - name: Download all 5 native JNI libraries
        uses: actions/download-artifact@v8
        with:
          pattern: java-native-*
          path: java-native-staging

      - name: Stage native resources into Maven layout
        run: |
          set -euo pipefail
          mkdir -p java-pkg/src/main/resources/native
          for target in darwin-arm64 darwin-x86_64 linux-x86_64 linux-aarch64 windows-x86_64; do
            src="java-native-staging/java-native-${target}"
            if [ ! -d "$src" ] || [ -z "$(ls -A "$src")" ]; then
              echo "::error::Missing native library for ${target}"
              exit 1
            fi
            mkdir -p "java-pkg/src/main/resources/native/${target}"
            cp "$src"/* "java-pkg/src/main/resources/native/${target}/"
          done

      - name: Generate pom.xml for Java 8 fat JAR (with sources and javadoc)
        env:
          PKG_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, re, tomllib
          from xml.sax.saxutils import escape

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          pkg = cargo.get("package", {})
          ws_pkg = cargo.get("workspace", {}).get("package", {})

          def get_meta(key, default=None):
              val = pkg.get(key)
              if isinstance(val, dict) and val.get("workspace") is True:
                  val = ws_pkg.get(key, default)
              return default if val is None else val

          group_id = os.environ["JAVA_GROUP_ID"].lower()
          artifact_id = os.environ["JAVA_ARTIFACT_ID"].lower().replace("_", "-")
          version = os.environ["PKG_VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          repo_lower = repo.lower()

          name = str(get_meta("name", artifact_id)).strip() or artifact_id
          description = " ".join(str(get_meta("description", f"{name} Java JNI bindings")).split())
          repo_url = str(get_meta("repository", "")).strip() or f"https://github.com/{repo}"
          homepage = str(get_meta("homepage", "")).strip() or repo_url
          license_str = str(get_meta("license", "")).strip()
          authors_val = get_meta("authors", [])

          licenses_xml = ""
          if license_str:
              licenses_xml = f"""
            <licenses>
              <license>
                <name>{escape(license_str)}</name>
              </license>
            </licenses>"""

          developers_xml = ""
          if isinstance(authors_val, list):
              dev_entries = []
              for raw in authors_val:
                  raw = str(raw).strip()
                  if not raw:
                      continue
                  m = re.match(r"^(.*?)\s*<([^>]+)>$", raw)
                  if m:
                      dev_name = m.group(1).strip()
                      dev_email = m.group(2).strip()
                      parts = []
                      if dev_name:
                          parts.append(f"      <name>{escape(dev_name)}</name>")
                      if dev_email:
                          parts.append(f"      <email>{escape(dev_email)}</email>")
                      if parts:
                          dev_entries.append("    <developer>\n" + "\n".join(parts) + "\n    </developer>")
                  else:
                      dev_entries.append(f"    <developer>\n      <name>{escape(raw)}</name>\n    </developer>")
              if dev_entries:
                  developers_xml = "\n  <developers>\n" + "\n".join(dev_entries) + "\n  </developers>"

          scm_host_path = repo_url.removeprefix("https://").removeprefix("http://").rstrip("/")
          pom = f"""<project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>

            <groupId>{escape(group_id)}</groupId>
            <artifactId>{escape(artifact_id)}</artifactId>
            <version>{escape(version)}</version>
            <packaging>jar</packaging>

            <name>{escape(name)}</name>
            <description>{escape(description)}</description>
            <url>{escape(homepage)}</url>{licenses_xml}{developers_xml}

            <scm>
              <connection>scm:git:https://{escape(scm_host_path)}.git</connection>
              <developerConnection>scm:git:ssh://git@{escape(scm_host_path)}.git</developerConnection>
              <url>{escape(repo_url)}</url>
            </scm>

            <issueManagement>
              <system>GitHub Issues</system>
              <url>{escape(repo_url.rstrip('/'))}/issues</url>
            </issueManagement>

            <properties>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              <project.reporting.outputEncoding>UTF-8</project.reporting.outputEncoding>
              <maven.compiler.source>1.8</maven.compiler.source>
              <maven.compiler.target>1.8</maven.compiler.target>
            </properties>

            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.14.1</version>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-source-plugin</artifactId>
                  <version>3.4.0</version>
                  <executions>
                    <execution>
                      <id>attach-sources</id>
                      <goals>
                        <goal>jar-no-fork</goal>
                      </goals>
                    </execution>
                  </executions>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-javadoc-plugin</artifactId>
                  <version>3.12.0</version>
                  <configuration>
                    <doclint>none</doclint>
                  </configuration>
                  <executions>
                    <execution>
                      <id>attach-javadocs</id>
                      <goals>
                        <goal>jar</goal>
                      </goals>
                    </execution>
                  </executions>
                </plugin>
              </plugins>
            </build>

            <distributionManagement>
              <repository>
                <id>github</id>
                <name>GitHub Packages</name>
                <url>https://maven.pkg.github.com/{escape(repo_lower)}</url>
              </repository>
            </distributionManagement>
          </project>
          """

          pathlib.Path("java-pkg/pom.xml").write_text(pom, encoding="utf-8")
          EOF

      - name: Build and publish Maven JAR to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -f java-pkg/pom.xml deploy